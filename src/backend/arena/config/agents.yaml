# Player config templates — loaded at backend startup.
# Each config defines a reusable LLM profile (provider, model, api_key, etc.).
# Players are instances of these configs with independent long-term memory.
#
# Fields:
#   name          — Unique display name for this config template.
#   provider      — "openai", "claude", or "random".
#   model         — Model name passed to the provider API.
#   api_key       — API key; supports ${ENV_VAR} substitution.
#   base_url      — Optional. Override the API base URL (OpenAI-compatible providers).

# ── Default players ──────────────────────────────────────────────────────────────
# Players created from configs at startup if they don't already exist.
# Each player becomes a row in the `players` table with independent experience.
# Remove or comment out to prevent auto-creation.
default_players:
  # Red Team
  - config: "Qwen-Balanced"
    display_name: "Qwen-Balanced R1"
  - config: "Qwen-Aggressive"
    display_name: "Qwen-Aggressive R2"
  - config: "Qwen-Conservative"
    display_name: "Qwen-Conservative R3"
  - config: "Qwen-Flexible"
    display_name: "Qwen-Flexible R4"

  # Blue Team
  - config: "Minimax-Balanced"
    display_name: "Minimax-Balanced B1"
  - config: "Minimax-Aggressive"
    display_name: "Minimax-Aggressive B2"
  - config: "Minimax-Conservative"
    display_name: "Minimax-Conservative B3"
  - config: "Minimax-Flexible"
    display_name: "Minimax-Flexible B4"

# ── Config templates ─────────────────────────────────────────────────────────────

